[package]
name = "gray-checkpoint"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Git stash checkpoints per session; /checkpoint list|restore <n>. Port of pi's git-checkpoint extension."

[[bin]]
name = "gray-checkpoint"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
